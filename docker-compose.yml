services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stock_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock_dev}
      POSTGRES_DB: ${POSTGRES_DB:-stock_v2}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
