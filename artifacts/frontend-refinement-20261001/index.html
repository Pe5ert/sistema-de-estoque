<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estoque V2 — 7 prints</title>
<style>body{margin:0;background:#141820;color:#f5f7fc;font:15px Arial,sans-serif}header{padding:24px;max-width:1100px;margin:auto}h1{font-size:25px}p{line-height:1.6;color:#c7cedb}nav{display:flex;gap:8px;flex-wrap:wrap}button{padding:10px 14px;border:1px solid #5f6d81;border-radius:4px;background:#202630;color:#f5f7fc;cursor:pointer}button[aria-pressed=true]{background:#4162ed}button:focus-visible{outline:3px solid #b8c9ff;outline-offset:3px}figure{max-width:1440px;margin:12px auto 30px;padding:0 16px}figcaption{margin:15px 0;font-weight:bold}img{display:block;max-width:100%;max-height:calc(100vh - 245px);object-fit:contain;object-position:left top}a{color:#b8c9ff}</style>
<header><h1>Estoque V2 · 7 prints</h1><p>As três primeiras imagens são referências visuais e devem ser analisadas como restrições concretas. A primeira é a principal referência de identidade. As quatro imagens seguintes representam o estado atual do sistema após o refinamento desta rodada.</p><nav aria-label="Selecionar imagem"></nav><p><a href="7-prints.zip" download>Baixar as 7 imagens</a></p></header><figure><figcaption id="caption"></figcaption><img aria-labelledby="caption" id="print"></figure>
<script>
const items=[['01-maruf.webp','1. Maruf — direção visual dominante'],['02-beadaptify.webp','2. Beadaptify — estrutura/sidebar'],['03-axel.webp','3. Axel — produtos/tabelas'],['04-dashboard.png','4. Dashboard atual'],['05-produtos.png','5. Produtos atual'],['06-movimentacoes.png','6. Movimentações atual — prévia local'],['07-historico.png','7. Histórico atual']];
const nav=document.querySelector('nav');items.forEach(([file,title],i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+title.split(' — ')[0].substring(3);b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');document.getElementById('caption').textContent=title;document.getElementById('print').src=file;document.getElementById('print').alt=title;};nav.append(b)});nav.firstElementChild.click();
</script></html>
